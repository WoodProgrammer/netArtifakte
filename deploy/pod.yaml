apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  dnsConfig:
    options:
    - name: ndots
      value: "1"
  containers:
  - name: app
    image: nginx
    env:
    - name: API_URL
      value: "https://api.example.com."
    - name: DB_URL
      value: "postgres://user:pass@db.example.com.:5432/db"
    - name: REDIS_URL
      value: "redis://cache.example.com.:6379"