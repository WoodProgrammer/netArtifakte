# This rule is not used by the project pcap-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the capture.netsgo.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pcap-operator
    app.kubernetes.io/managed-by: kustomize
  name: packetcapture-editor-role
rules:
- apiGroups:
  - capture.netsgo.io
  resources:
  - packetcaptures
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - capture.netsgo.io
  resources:
  - packetcaptures/status
  verbs:
  - get
