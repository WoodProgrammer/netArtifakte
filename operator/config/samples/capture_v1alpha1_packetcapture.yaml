# Pod mode: capture inside the network namespace of each matching pod (the pod's own view).
apiVersion: capture.netsgo.io/v1alpha1
kind: PacketCapture
metadata:
  labels:
    app.kubernetes.io/name: pcap-operator
    app.kubernetes.io/managed-by: kustomize
  name: dns-issue-pods
spec:
  mode: Pod
  pod:
    selector:
      matchLabels:
        run: app
    maxPods: 2
  filter: "port 53"
  duration: 60s
  maxSizeMB: 50
  analysis:
    analysisId: 1
    provider: claude
    description: "dns address for app pods"
    question: "What is latency on Cloudflare dns. address approx."
---
