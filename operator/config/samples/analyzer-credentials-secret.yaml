# Credentials of a pcap-analyzer user (team member of the target analyses), used by the operator
# (polling) and the capture jobs (upload). Must live in the operator namespace.
apiVersion: v1
kind: Secret
metadata:
  name: pcap-analyzer-credentials
  namespace: pcap-operator-system
type: Opaque
stringData:
  username: k8s-operator
  password: change-me
